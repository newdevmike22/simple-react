<html lang="en">
  <head>
    <title>Chatbot App</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const ChatInput = ({ chatMessages, setChatMessages }) => {
        const [inputText, setInputText] = React.useState("");

        const saveInputText = (event) => {
          setInputText(event.target.value);
        };

        const sendMessage = () => {
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];
          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setInputText("");
        };
        return (
          <>
            <input placeholder="Send a message to Chatbot" size="30" onChange={saveInputText} value={inputText} />
            <button onClick={sendMessage}>Send</button>
          </>
        );
      };

      const ChatMessage = ({ message, sender }) => {
        return (
          <div>
            {sender === "robot" && <img src="./images/robot.png" width="50" alt="Chatbot app robot icon." />}
            {message}
            {sender === "user" && <img src="./images/user.png" width="50" alt="Chatbot app user icon." />}
          </div>
        );
      };

      const ChatMessages = ({ chatMessages }) => {
        return (
          <>
            {chatMessages.map((chatMessage) => {
              return <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id} />;
            })}
          </>
        );
      };

      const App = () => {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello chatbot.",
            sender: "user",
            id: "id1",
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
          },
          {
            message: "Can you give me today's date?",
            sender: "user",
            id: "id3",
          },
          {
            message: "Today is August 2",
            sender: "robot",
            id: "id4",
          },
        ]);

        //const [chatMessages, setChatMessages] = array;
        //const chatMessages = array[0];
        //const setChatMessages = array[1];
        return (
          <>
            <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
            <ChatMessages chatMessages={chatMessages} />
          </>
        );
      };

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
