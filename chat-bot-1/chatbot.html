<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <title>Chatbot App</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const ChatInput = ({ chatMessages, setChatMessages }) => {
        const [inputText, setInputText] = React.useState("");

        const saveInputText = (event) => {
          setInputText(event.target.value);
        };

        const sendMessage = () => {
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];
          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setInputText("");
        };
        return (
          <div className="chat-input-container">
            <input placeholder="Send a message to Chatbot" size="30" onChange={saveInputText} value={inputText} className="chat-input" />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      };

      const ChatMessage = ({ message, sender }) => {
        return (
          <div className={sender === "user" ? "chat-message-user" : "chat-message-robot"}>
            {sender === "robot" && <img src="./images/robot.png" className="chat-message-profile" alt="Chatbot app robot icon." />}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && <img src="./images/user.png" className="chat-message-profile" alt="Chatbot app user icon." />}
          </div>
        );
      };

      const ChatMessages = ({ chatMessages }) => {
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id} />;
            })}
          </div>
        );
      };

      const App = () => {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello chatbot.",
            sender: "user",
            id: "id1",
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
          },
          {
            message: "Can you give me today's date?",
            sender: "user",
            id: "id3",
          },
          {
            message: "Today is August 2",
            sender: "robot",
            id: "id4",
          },
        ]);

        //const [chatMessages, setChatMessages] = array;
        //const chatMessages = array[0];
        //const setChatMessages = array[1];
        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
          </div>
        );
      };

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
